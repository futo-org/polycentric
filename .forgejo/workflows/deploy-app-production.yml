name: Deploy app to production

# GitLab build_app.yml (EAS) and deploy_app.yml (app), production channel,
# from the default branch's head on develop's native libraries. Release tags
# go through release.yml.

on:
  workflow_dispatch:

concurrency:
  group: deploy-app-production
  cancel-in-progress: false

jobs:
  sdks:
    name: Build SDKs
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/sdk-build
        with:
          registry: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}
          libraries: android ios
          rn-sdk: 'true'

  # Store builds only queue on EAS, so their submit jobs follow right away
  # and EAS waits for the build itself.
  store:
    name: ${{ matrix.label }}
    needs: sdks
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            name: app-android-aab-production
            label: Build Android AAB
          - platform: ios
            name: app-ios-production
            label: Build iOS app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/eas-build
        with:
          platform: ${{ matrix.platform }}
          profile: production
      - uses: forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: apps/harbor/eas-build.json
          retention-days: 7

  apk:
    name: Build Android APK
    needs: sdks
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/eas-build
        with:
          platform: android
          profile: production-apk
          wait: 'true'
      - uses: forgejo/upload-artifact@v4
        with:
          name: app-android-apk-production
          path: |
            apps/harbor/eas-build.json
            apps/harbor/harbor.apk
          retention-days: 7

  # eas-cli needs the expo project config even when submitting by id.
  store-deploy:
    name: ${{ matrix.label }}
    needs: store
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            build: app-android-aab-production
            label: Deploy Android app
          - platform: ios
            build: app-ios-production
            label: Deploy iOS app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: forgejo/download-artifact@v4
        with:
          name: ${{ matrix.build }}
          path: apps/harbor
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter polycentric-app...
      - name: Submit to the store
        working-directory: apps/harbor
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          BUILD_ID=$(node -p "[].concat(JSON.parse(require('fs').readFileSync('eas-build.json', 'utf8')))[0].id")
          npx eas-cli submit --platform "$PLATFORM" --profile production --id "$BUILD_ID" --non-interactive --no-wait

  apk-deploy:
    name: Deploy APK
    needs: apk
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    env:
      UPDATE_CHANNEL: production
      STATIC_S3_ENDPOINT: ${{ secrets.STATIC_S3_ENDPOINT }}
      STATIC_S3_BUCKET: ${{ vars.STATIC_S3_BUCKET }}
      STATIC_S3_ACCESS_KEY_ID: ${{ secrets.STATIC_S3_ACCESS_KEY_ID }}
      STATIC_S3_SECRET_ACCESS_KEY: ${{ secrets.STATIC_S3_SECRET_ACCESS_KEY }}
      STATIC_PUBLIC_BASE_URL: ${{ vars.STATIC_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: forgejo/download-artifact@v4
        with:
          name: app-android-apk-production
          path: apps/harbor
      - name: Publish the APK
        run: |
          export CI_COMMIT_SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          export CI_COMMIT_TITLE=$(git log -1 --format=%s)
          node .gitlab/ci/scripts/publish-android-update.mjs
