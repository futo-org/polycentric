name: JS services

# GitLab build_services.yml (scraper, verifier-bot).

on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      registry:
        type: string
        required: true
      ref_slug:
        type: string
        required: true
      default_ref:
        type: string
        required: true
      chart_version:
        type: string
        required: true

jobs:
  js-services-checks:
    name: JS services / Check
    if: fromJSON(inputs.plan).flags.verifier_bot || fromJSON(inputs.plan).flags.scraper
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter polycentric --filter @polycentric/scraper...
      - name: Verifier bot biome
        if: fromJSON(inputs.plan).flags.verifier_bot
        continue-on-error: true
        run: pnpm exec biome check services/verifier-bot --diagnostic-level=error
      - name: Scraper typecheck
        if: ${{ !cancelled() && fromJSON(inputs.plan).flags.scraper }}
        run: pnpm --filter @polycentric/scraper build
      - name: Scraper tests
        if: ${{ !cancelled() && fromJSON(inputs.plan).flags.scraper }}
        run: pnpm --filter @polycentric/scraper test:ci
      - uses: forgejo/upload-artifact@v4
        if: always() && fromJSON(inputs.plan).flags.scraper
        with:
          name: junit-scraper
          path: services/scraper/junit.xml
          retention-days: 7

  scraper-image:
    name: JS services / Build scraper image
    needs: js-services-checks
    if: ${{ !cancelled() && fromJSON(inputs.plan).flags.image_scraper && needs.js-services-checks.result != 'failure' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    steps:
      - name: Install tools
        run: apk add --no-cache bash git docker-cli docker-cli-buildx
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/service-image
        with:
          image: scraper
          dockerfile: services/scraper
          registry: ${{ inputs.registry }}
          ref-slug: ${{ inputs.ref_slug }}
          default-branch-tag: ${{ inputs.default_ref }}
          export-cache: ${{ inputs.default_ref }}
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          cosign-key: ${{ secrets.COSIGN_PRIVATE_KEY }}

  scraper-deploy:
    name: JS services / Deploy scraper to staging
    needs: scraper-image
    if: ${{ !cancelled() && fromJSON(inputs.plan).flags.deploy_scraper && needs.scraper-image.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    steps:
      - name: Install tools
        run: apk add --no-cache bash git curl crane
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ inputs.registry }}
          image: scraper
          chart: harbor-scraper
          chart-version: ${{ inputs.chart_version }}
          environment: staging
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

  scraper-integration:
    name: JS services / Test scraper integration
    needs: scraper-image
    if: ${{ !cancelled() && fromJSON(inputs.plan).flags.scraper_integration && needs.scraper-image.result != 'failure' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    continue-on-error: true
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    steps:
      - name: Install Chromium
        run: apt-get update && apt-get install -y --no-install-recommends chromium && rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter @polycentric/scraper...
      - name: Integration tests
        run: pnpm --filter @polycentric/scraper test:integration
      - uses: forgejo/upload-artifact@v4
        if: always()
        with:
          name: junit-scraper-integration
          path: services/scraper/junit.xml
          retention-days: 7

  verifier-bot-image:
    name: JS services / Build verifier bot image
    needs: js-services-checks
    if: ${{ !cancelled() && fromJSON(inputs.plan).flags.image_verifier_bot && needs.js-services-checks.result != 'failure' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    steps:
      - name: Install tools
        run: apk add --no-cache bash git docker-cli docker-cli-buildx
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/sdk-artifacts
      - uses: ./.forgejo/actions/service-image
        with:
          image: verifier-bot
          dockerfile: services/verifier-bot
          registry: ${{ inputs.registry }}
          ref-slug: ${{ inputs.ref_slug }}
          default-branch-tag: ${{ inputs.default_ref }}
          export-cache: ${{ inputs.default_ref }}
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          cosign-key: ${{ secrets.COSIGN_PRIVATE_KEY }}

  verifier-bot-deploy:
    name: JS services / Deploy verifier bot to staging
    needs: verifier-bot-image
    if: ${{ !cancelled() && fromJSON(inputs.plan).flags.deploy_verifier_bot && needs.verifier-bot-image.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    steps:
      - name: Install tools
        run: apk add --no-cache bash git curl crane
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ inputs.registry }}
          image: verifier-bot
          chart: harbor-verifier-bot
          chart-version: ${{ inputs.chart_version }}
          environment: staging
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

  # VERIFIER_BOT_ENV_VARS is the base64 .env content (GitLab: a file variable).
  verifier-bot-tests:
    name: JS services / Test verifier bot
    if: fromJSON(inputs.plan).flags.verifier_bot_tests
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      POLYCENTRIC_VERIFIER_BOT_PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    steps:
      - name: Install Chromium
        run: apt-get update && apt-get install -y --no-install-recommends chromium && rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/sdk-artifacts
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter @polycentric/verifier-bot...
      - name: Write test env
        env:
          VERIFIER_BOT_ENV_VARS: ${{ secrets.VERIFIER_BOT_ENV_VARS }}
        run: if [ -n "$VERIFIER_BOT_ENV_VARS" ]; then echo "$VERIFIER_BOT_ENV_VARS" | base64 -d > services/verifier-bot/.test.env; fi
      - name: Tests
        run: pnpm --filter @polycentric/verifier-bot test:ci
      - uses: forgejo/upload-artifact@v4
        if: always()
        with:
          name: junit-verifier-bot-tests
          path: services/verifier-bot/junit.xml
          retention-days: 7
