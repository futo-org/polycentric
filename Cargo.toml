[workspace]
members = [
    "packages/rs-common",
    "packages/rs-core",
    "services/server",
    "services/server/entity",
    "services/server/migration",
    "services/server/tests",
    "services/server/perf-tests",
    "services/moderation",
    "services/push-notifications",
    "services/common/*",
    "tools/identity",
]
exclude = ["legacy/"]
resolver = "2"

[workspace.dependencies]
# Internal crates
polycentric-common = { path = "packages/rs-common" }

# Async runtime / service frameworks
tokio = { version = "1.50.0", default-features = false }
uniffi = { version = "=0.31.0", default-features = false, features = ["tokio"] }
rdkafka = { version = "0.39", default-features = false }
sea-orm = { version = "2.0.1", default-features = false }
sea-orm-migration = { version = "2.0.1", default-features = false }

# Protobuf / gRPC
prost = { version = "0.14", default-features = false }
prost-types = { version = "0.14", default-features = false }
prost-build = { version = "0.14", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = { version = "0.14", default-features = false }

# Crypto / hashing
ed25519-dalek = { version = "3.0.0", default-features = false }
sha2 = { version = "0.11", default-features = false }
getrandom = { version = "0.4", default-features = false }
hex = { version = "0.4", default-features = false }

# Misc shared
thiserror = { version = "2.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "json"] }
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry-prometheus = { version = "0.32", default-features = false }
prometheus = { version = "0.14", default-features = false }
time = { version = "0.3.55", default-features = false }
base64 = { version = "0.22.1", default-features = false }
