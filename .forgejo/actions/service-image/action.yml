name: service-image
description: buildx image build pushed as <registry>/<image>:<sha> with a registry layer cache (GitLab .service-image).
inputs:
  image:
    description: Image name under the registry (server, moderation-service, web, ...)
    required: true
  dockerfile:
    description: Directory holding the Dockerfile; the build context is the repo root
    required: true
  registry:
    required: true
  ref-slug:
    required: true
  default-branch-tag:
    description: Also push the moving <default branch> tag
    default: 'false'
  build-args:
    description: One KEY=VALUE per line
    default: ''
  export-cache:
    description: Refresh the branch's build cache; the default branch keeps the shared one warm
    default: 'false'
  registry-user:
    required: true
  registry-token:
    required: true
  cosign-key:
    description: COSIGN_PRIVATE_KEY; the pushed image is signed with it (empty skips)
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.forgejo/actions/registry-login
      with:
        registry: ${{ inputs.registry }}
        registry-user: ${{ inputs.registry-user }}
        registry-token: ${{ inputs.registry-token }}
    - shell: bash
      env:
        IMAGE: ${{ inputs.registry }}/${{ inputs.image }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        REF_SLUG: ${{ inputs.ref-slug }}
        DEFAULT_BRANCH_TAG: ${{ inputs.default-branch-tag }}
        BUILD_ARGS: ${{ inputs.build-args }}
        EXPORT_CACHE: ${{ inputs.export-cache }}
      run: |
        # Matrix rows share the droplet's daemon, so the name must be unique per job.
        builder="buildx-$(tr -d - < /proc/sys/kernel/random/uuid | cut -c1-12)"
        docker buildx create --name "$builder" --driver docker-container --use
        trap 'docker buildx rm "$builder"' EXIT
        set -- --tag "$IMAGE:$GITHUB_SHA"
        if [ "$DEFAULT_BRANCH_TAG" = true ]; then
          set -- "$@" --tag "$IMAGE:${DEFAULT_BRANCH:-develop}"
        fi
        while IFS= read -r arg; do
          [ -n "$arg" ] && set -- "$@" --build-arg "$arg"
        done <<< "$BUILD_ARGS"
        set -- "$@" --file "$DOCKERFILE/Dockerfile" \
          --cache-from "type=registry,ref=$IMAGE:cache-${DEFAULT_BRANCH:-develop}"
        docker buildx build --push "$@" .
        # A separate pass: zot drops one of two concurrent uploads of a blob.
        # mode=max keeps the build stages, so a later build resumes from the
        # step that changed instead of the top of the Dockerfile.
        if [ "$EXPORT_CACHE" = true ]; then
          docker buildx build "$@" \
            --cache-to "type=registry,ref=$IMAGE:cache-$REF_SLUG,mode=max,ignore-error=true,image-manifest=true,oci-mediatypes=true" .
        fi
    # Sign the commit's image by digest; the moving tags share that digest.
    - uses: ./.forgejo/actions/cosign-sign
      with:
        refs: ${{ inputs.registry }}/${{ inputs.image }}:${{ github.sha }}
        key: ${{ inputs.cosign-key }}
