name: Checks

# Repo-wide checks; component checks live with their component.

on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true

jobs:
  workflows-lint:
    name: Checks / Lint workflows
    if: fromJSON(inputs.plan).flags.ci
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    env:
      ZIZMOR_VERSION: 1.30.0
      ZIZMOR_SHA256: ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed
    steps:
      - uses: actions/checkout@v4
      - name: Install zizmor
        run: |
          curl -fsSL -o zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZIZMOR_SHA256  zizmor.tar.gz" | sha256sum -c
          tar xzf zizmor.tar.gz -C /usr/local/bin zizmor
      - name: zizmor
        run: zizmor --no-online-audits --config .forgejo/zizmor.yml .forgejo/workflows/*.yml .forgejo/actions

  # GitLab scan_dependencies.yml.
  trivy:
    name: Checks / Scan dependencies
    if: fromJSON(inputs.plan).flags.scan
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    continue-on-error: true
    env:
      TRIVY_NO_PROGRESS: 'true'
      TRIVY_CACHE_DIR: .trivycache/
    steps:
      - uses: actions/checkout@v4
      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.72.0
      # Report artifact instead of the GitLab code quality report.
      - name: Report
        run: trivy filesystem --scanners misconfig,vuln --exit-code 0 --severity CRITICAL --format json -o trivy-report.json .
      - uses: forgejo/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 7
      - name: Scan
        run: trivy filesystem --scanners misconfig,vuln --exit-code 1 --severity CRITICAL .
