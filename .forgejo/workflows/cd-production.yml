name: Deploy to production

# Manual: relabels what staging runs (or a commit's images and charts)
# production, one step per component picked; apps builds the production EAS
# apps from the ref's head and submits them.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy instead of the staging tags (its components must have been built)
        type: string
        default: ''
      server:
        type: boolean
        default: false
      moderation:
        type: boolean
        default: false
      push_notifications:
        type: boolean
        default: false
      scraper:
        type: boolean
        default: false
      verifier_bot:
        type: boolean
        default: false
      web:
        type: boolean
        default: false
      apps:
        description: Build the production apps on EAS and submit them (default branch only)
        type: boolean
        default: false

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: inputs.server || inputs.moderation || inputs.push_notifications || inputs.scraper || inputs.verifier_bot || inputs.web
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    env:
      REGISTRY: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}
      TAG: ${{ inputs.sha || 'staging' }}
      STATIC_S3_ENDPOINT: ${{ secrets.STATIC_S3_ENDPOINT }}
      STATIC_S3_BUCKET: ${{ vars.STATIC_S3_BUCKET }}
      STATIC_S3_ACCESS_KEY_ID: ${{ secrets.STATIC_S3_ACCESS_KEY_ID }}
      STATIC_S3_SECRET_ACCESS_KEY: ${{ secrets.STATIC_S3_SECRET_ACCESS_KEY }}
      STATIC_PUBLIC_BASE_URL: ${{ vars.STATIC_PUBLIC_BASE_URL }}
    steps:
      - name: Install tools
        run: apk add --no-cache bash git curl crane
      - uses: actions/checkout@v4
      - name: Server
        if: inputs.server
        uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: server
          chart: harbor-server
          chart-version: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          environment: production
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Moderation
        if: inputs.moderation
        uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: moderation-service
          chart: harbor-moderation
          chart-version: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          environment: production
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Push notifications
        if: inputs.push_notifications
        uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: push-notifications-service
          chart: harbor-push-notifications
          chart-version: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          environment: production
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Scraper
        if: inputs.scraper
        uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: scraper
          chart: harbor-scraper
          chart-version: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          environment: production
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Verifier bot
        if: inputs.verifier_bot
        uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: verifier-bot
          chart: harbor-verifier-bot
          chart-version: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          environment: production
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Web
        if: inputs.web
        uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: web
          chart: harbor-web
          chart-version: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          environment: production
          web-assets: 'true'
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

  changes:
    name: Plan
    if: inputs.apps
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      images_tag: ${{ steps.plan.outputs.images_tag }}
      default_branch: ${{ steps.plan.outputs.default_branch }}
      default_ref: ${{ steps.plan.outputs.default_ref }}
      plan: ${{ steps.plan.outputs.plan }}
      images_missing: ${{ steps.plan.outputs.images_missing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.forgejo/actions/plan
        id: plan
        with:
          eas-production: 'true'

  setup-images:
    name: Build CI images
    needs: changes
    if: inputs.apps
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    steps:
      - uses: ./.forgejo/actions/ci-images
        if: needs.changes.outputs.images_missing == 'true'
        with:
          registry: ${{ needs.changes.outputs.registry }}
          tag: ${{ needs.changes.outputs.images_tag }}
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          cosign-key: ${{ secrets.COSIGN_PRIVATE_KEY }}

  packages:
    name: Packages
    needs: [changes, setup-images]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.setup-images.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-packages.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      registry: ${{ needs.changes.outputs.registry }}
      images_tag: ${{ needs.changes.outputs.images_tag }}
      default_branch: ${{ needs.changes.outputs.default_branch }}
      default_ref: ${{ needs.changes.outputs.default_ref }}

  app-web-checks:
    name: App & web checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    uses: ./.forgejo/workflows/ci-app-web-checks.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  app:
    name: App
    needs: [changes, packages, app-web-checks]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.packages.result != 'failure' &&
      needs.app-web-checks.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-app.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      is_tag: 'false'
