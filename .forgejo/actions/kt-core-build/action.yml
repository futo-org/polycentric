name: kt-core-build
description: Build the Kotlin SDK as an AAR
inputs:
  task:
    description: Gradle task to run
    default: ':core:assembleRelease'
  upload-artifact:
    description: Upload packages/kt-core/core/build/ as the kt-core-build artifact
    default: 'true'
runs:
  using: composite
  steps:
    - uses: ./.forgejo/actions/rust-env
      with:
        cache: kt-core
    - uses: ./.forgejo/actions/r2-cache
      with:
        mode: restore
        key: gradle-${{ hashFiles('packages/kt-core/gradle/libs.versions.toml', 'packages/kt-core/gradle/wrapper/gradle-wrapper.properties') }}
        path: |
          .gradle/wrapper
          .gradle/caches
    - shell: bash
      env:
        KT_CORE_GRADLE_TASK: ${{ inputs.task }}
      run: cd packages/kt-core && ./gradlew "${KT_CORE_GRADLE_TASK:-:core:assembleRelease}"
    - uses: ./.forgejo/actions/r2-cache
      with:
        mode: save
        key: gradle-${{ hashFiles('packages/kt-core/gradle/libs.versions.toml', 'packages/kt-core/gradle/wrapper/gradle-wrapper.properties') }}
        path: |
          .gradle/wrapper
          .gradle/caches
    - uses: forgejo/upload-artifact@v4
      if: inputs.upload-artifact == 'true'
      with:
        name: kt-core-build
        path: packages/kt-core/core/build/
        retention-days: 7
