# Build the rs-core-wasm wasm bindings (web + Node). The native TurboModule
# libraries are built by the rn-android-build / rn-ios-build jobs instead.
# Only runs when its inputs change; consumers go through rs-core-libraries.
rs-core-wasm-build:
  extends: .rs-core-workflow
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pnpm-lock.yaml
        - patches/**/*
        - packages/rs-core-wasm/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pnpm-lock.yaml
        - patches/**/*
        - packages/rs-core-wasm/**/*
    - !reference [.rs-core-workflow, rules]
    - !reference [.release-workflow, rules]
  # Self-populating per job: the first run downloads and compiles
  # everything and uploads the result; every run after starts with warm
  # crate sources and sccache hits for unchanged crates.
  cache:
    key:
      files:
        - Cargo.lock
      prefix: cargo-${CI_JOB_NAME}
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      - .sccache
    policy: pull-push
  script:
    - cd packages/rs-core-wasm
    - |
      rustup target add \
        wasm32-unknown-unknown
    - pnpm i
    - pnpm build --release
  artifacts:
    paths:
      - packages/rs-core-wasm/src/generated/wasm
      - packages/rs-core-wasm/dist
    expire_in: 1 week

# Collects the rs-core libraries for downstream jobs. The build jobs are
# optional needs; anything they didn't build is fetched from the newest
# successful run of that build job on develop.
rs-core-libraries:
  stage: build
  image: alpine:latest
  needs:
    - job: rs-core-wasm-build
      artifacts: true
      optional: true
    - job: rn-android-build
      artifacts: true
      optional: true
    - job: rn-ios-build
      artifacts: true
      optional: true
  rules:
    - !reference [.rs-core-workflow, rules]
    - !reference [.js-sdk-workflow, rules]
    - !reference [.rn-sdk-workflow, rules]
    - !reference [.app-workflow, rules]
    - !reference [.verifier-bot-workflow, rules]
    - !reference [.release-workflow, rules]
  before_script:
    - apk add --no-cache curl jq unzip
  script:
    - .gitlab/ci/scripts/fetch-rs-core-libraries.sh
  artifacts:
    paths:
      - packages/rs-core-wasm/src/generated/wasm
      - packages/rs-core-wasm/dist
      - packages/react-native/android/src/main/jniLibs
      - packages/react-native/ios
      - packages/react-native/PolycentricReactNativeFramework.xcframework
    expire_in: 1 week
