[package]
edition      = "2024"
name         = "server-migration"
publish      = false
rust-version = "1.85.0"
version      = "0.1.0"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
entity = { path = "../entity" }
polycentric-common.workspace = true
prost.workspace = true
sea-orm = { workspace = true, features = ["macros", "with-chrono", "with-json"] }
sea-orm-migration = { workspace = true, features = ["cli", "sqlx-postgres", "runtime-tokio" ] }
serde_json = "1"
tokio = { workspace = true, features = ["macros", "rt"] }
