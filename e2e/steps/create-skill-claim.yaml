appId: ${MAESTRO_APP_ID}
---
# From the Verifications tab: creates a Skill claim. The app then opens the
# new claim with its "Request verification" sheet already up.
- tapOn: ${output.verifications.createClaim}
- tapOn: ${output.verifications.skillType}
# The skill field has focus when the form opens, except on web. Its
# placeholder is also the sheet title, so target the input itself there.
- runFlow:
    when:
      platform: Web
    commands:
      - tapOn:
          css: 'input[placeholder="${output.verifications.skillType}"]'
- inputText: Sailing
- tapOn: ${output.verifications.create}
- extendedWaitUntil:
    visible: ${output.verifications.searchProfiles}
    timeout: 30000
