name: Docs deploy

# GitLab deploy_docs.yml.

on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      pr_number:
        type: string
        default: ''

jobs:
  docs-deploy:
    name: Deploy docs
    if: fromJSON(inputs.plan).flags.docs_deploy
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: forgejo/download-artifact@v4
        with:
          name: docs-build
          path: docs/build
      - name: Install wrangler
        run: npm install -g wrangler # zizmor: ignore[adhoc-packages]
      - name: Deploy
        run: wrangler pages deploy ./docs/build --project-name=polycentric-docs --branch=production

  # Preview at https://pr-<n>.polycentric-docs-cs8.pages.dev
  docs-review:
    name: Deploy docs preview
    if: fromJSON(inputs.plan).flags.docs_preview
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - uses: forgejo/download-artifact@v4
        with:
          name: docs-build
          path: docs/build
      - name: Install wrangler
        run: npm install -g wrangler # zizmor: ignore[adhoc-packages]
      - name: Deploy
        run: wrangler pages deploy ./docs/build --project-name=polycentric-docs --branch="pr-$PR_NUMBER"
      - name: Preview URL
        run: echo "https://pr-$PR_NUMBER.polycentric-docs-cs8.pages.dev"

  docs-review-stop:
    name: Remove docs preview
    if: fromJSON(inputs.plan).flags.docs_preview_stop
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete the preview
        run: node .gitlab/ci/scripts/cf-pages-delete-branch.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: polycentric-docs
          CF_PAGES_BRANCH: pr-${{ inputs.pr_number }}
