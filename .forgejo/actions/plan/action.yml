name: plan
description: Runs changes.mjs and the CI image check; the workflows gate their jobs on the outputs.
inputs:
  event-before:
    default: ''
outputs:
  registry:
    value: ${{ steps.plan.outputs.registry }}
  images_tag:
    value: ${{ steps.plan.outputs.images_tag }}
  plan:
    value: ${{ steps.plan.outputs.plan }}
  images_missing:
    value: ${{ steps.images.outputs.images_missing }}
runs:
  using: composite
  steps:
    - name: Resolve plan
      id: plan
      shell: bash
      env:
        REGISTRY: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}
        EVENT_BEFORE: ${{ inputs.event-before }}
      run: node .forgejo/scripts/changes.mjs
    - name: Check CI images
      id: images
      shell: bash
      env:
        REGISTRY: ${{ steps.plan.outputs.registry }}
        TAG: ${{ steps.plan.outputs.images_tag }}
      run: .forgejo/scripts/ci-images.sh check
