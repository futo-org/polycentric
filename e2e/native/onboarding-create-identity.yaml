appId: ${MAESTRO_APP_ID}
---
- runFlow: ../launch.yaml
- tapOn: 'Create new identity'
- tapOn: 'Enter display name'
- inputText: 'Maestro'
# Not hideKeyboard: on Android that is a blind Back press, which pops this
# screen whenever Gboard has no soft keyboard up (its physical-keyboard or
# stylus toolbar modes). Enter blurs the field and dismisses the keyboard.
- pressKey: Enter
- tapOn: 'Continue'
# Registering for push prompts once per install.
- tapOn:
    text: 'Allow'
    optional: true
# Creating the identity publishes to the server, so give it room.
- extendedWaitUntil:
    visible: 'Explore'
    timeout: 120000
