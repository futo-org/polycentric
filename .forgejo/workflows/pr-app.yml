name: PR apps

# The build-app label on a pull request: the staging EAS builds for its head,
# on the rs-core libraries its Test run published (else develop's).

on:
  pull_request:
    types: [labeled]

concurrency:
  group: pr-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdks:
    name: Build SDKs
    if: github.event.label.name == 'build-app'
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/sdk-build
        with:
          registry: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}
          rn-sdk: 'true'

  store:
    name: ${{ matrix.label }}
    needs: sdks
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            name: app-android-aab-staging
            label: Build Android AAB
          - platform: ios
            name: app-ios-staging
            label: Build iOS app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/eas-build
        with:
          platform: ${{ matrix.platform }}
          profile: staging
      - uses: forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: apps/harbor/eas-build.json
          retention-days: 7

  apk:
    name: Build Android APK
    needs: sdks
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/eas-build
        with:
          platform: android
          profile: staging-apk
          wait: 'true'
      - uses: forgejo/upload-artifact@v4
        with:
          name: app-android-apk-staging
          path: |
            apps/harbor/eas-build.json
            apps/harbor/harbor.apk
          retention-days: 7
