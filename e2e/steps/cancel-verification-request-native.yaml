appId: ${MAESTRO_APP_ID}
---
# Cancels the verification request on the first verifier row, the newest one
# (the flow asserts by name which one went). The menu closes before the alert
# opens, so the same text taps the menu item and then the alert's confirm
# button.
- tapOn:
    text: ${output.verifications.verifierOptions}
    index: 0
- tapOn: ${output.verifications.cancelRequest}
- assertVisible: ${output.verifications.cancelRequestTitle}
- tapOn: ${output.verifications.cancelRequest}
