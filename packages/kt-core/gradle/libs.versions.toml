[versions]
agp = "9.4.0"
coroutines = "1.10.1"
wire = "6.4.7"
jna = "5.18.1"
okhttp = "4.12.0"
bouncycastle = "1.79"
junit = "4.13.2"
androidx-test = "1.6.1"
# Real org.json for JVM unit tests — the android.jar copy is a stub that
# throws, and Moderation/ServerJwt tests parse JSON on the host JVM.
orgjson = "20240303"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# uniffi-generated Kotlin loads the native library through JNA; the @aar
# classifier ships the Android native bits.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# ed25519 (Android Keystore has no ed25519 support, keys are app-managed)
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
orgjson = { module = "org.json:json", version.ref = "orgjson" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
