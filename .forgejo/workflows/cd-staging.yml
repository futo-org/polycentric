name: Deploy

# GitLab deploy_services.yml and deploy_app.yml.

on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      registry:
        type: string
        required: true
      chart_version:
        type: string
        required: true

jobs:
  deploy-staging:
    name: ${{ matrix.label }}
    if: fromJSON(inputs.plan).flags.deploy_staging
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).matrix.deploy_staging }}
    env:
      STATIC_S3_ENDPOINT: ${{ secrets.STATIC_S3_ENDPOINT }}
      STATIC_S3_BUCKET: ${{ secrets.STATIC_S3_BUCKET }}
      STATIC_S3_REGION: ${{ secrets.STATIC_S3_REGION }}
      STATIC_S3_ACCESS_KEY_ID: ${{ secrets.STATIC_S3_ACCESS_KEY_ID }}
      STATIC_S3_SECRET_ACCESS_KEY: ${{ secrets.STATIC_S3_SECRET_ACCESS_KEY }}
      STATIC_PUBLIC_BASE_URL: ${{ secrets.STATIC_PUBLIC_BASE_URL }}
    steps:
      - name: Install tools
        run: apk add --no-cache bash git curl crane
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ inputs.registry }}
          image: ${{ matrix.image }}
          chart: ${{ matrix.chart }}
          chart-version: ${{ inputs.chart_version }}
          environment: staging
          web-assets: ${{ matrix.web_assets || false }}
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

  # eas-cli needs the expo project config even when submitting by id; a
  # still-running build waits on the EAS side.
  app-deploy-store:
    name: ${{ matrix.label }}
    if: fromJSON(inputs.plan).flags.store_submits
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).matrix.store_submits }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: forgejo/download-artifact@v4
        with:
          name: ${{ matrix.build }}
          path: apps/harbor
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter polycentric-app...
      - name: Submit to the store
        env:
          PLATFORM: ${{ matrix.platform }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          cd apps/harbor
          BUILD_ID=$(node -p "[].concat(JSON.parse(require('fs').readFileSync('eas-build.json', 'utf8')))[0].id")
          npx eas-cli submit --platform "$PLATFORM" --profile "$CHANNEL" --id "$BUILD_ID" --non-interactive --no-wait

  # APK update feed (scripts/publish-android-update.mjs).
  app-deploy-apk:
    name: ${{ matrix.label }}
    if: fromJSON(inputs.plan).flags.apk_publishes
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).matrix.apk_publishes }}
    env:
      UPDATE_CHANNEL: ${{ matrix.channel }}
      STATIC_S3_ENDPOINT: ${{ secrets.STATIC_S3_ENDPOINT }}
      STATIC_S3_BUCKET: ${{ secrets.STATIC_S3_BUCKET }}
      STATIC_S3_REGION: ${{ secrets.STATIC_S3_REGION }}
      STATIC_S3_ACCESS_KEY_ID: ${{ secrets.STATIC_S3_ACCESS_KEY_ID }}
      STATIC_S3_SECRET_ACCESS_KEY: ${{ secrets.STATIC_S3_SECRET_ACCESS_KEY }}
      STATIC_PUBLIC_BASE_URL: ${{ secrets.STATIC_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: forgejo/download-artifact@v4
        with:
          name: app-android-apk-${{ matrix.channel }}
          path: apps/harbor
      # v* tags feed the release notes into latest.json.
      - if: matrix.channel == 'production' && fromJSON(inputs.plan).flags.release
        uses: forgejo/download-artifact@v4
        with:
          name: release-notes
          path: .
      - name: Publish to the update feed
        run: |
          export CI_COMMIT_SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          export CI_COMMIT_TITLE=$(git log -1 --format=%s)
          node .gitlab/ci/scripts/publish-android-update.mjs
