name: deploy-tag
description: Tags the commit's image and chart with the environment label helm-controller watches (GitLab .service-deploy-image / .web-deploy-image).
inputs:
  registry:
    required: true
  image:
    required: true
  chart:
    required: true
  chart-version:
    description: Existing tag of the chart to relabel
    required: true
  environment:
    description: staging or production
    required: true
  sha:
    description: Commit whose image to deploy (default GITHUB_SHA)
    default: ''
  web-assets:
    description: Upload the web bundle to the static bucket first (needs STATIC_* env)
    default: 'false'
  registry-user:
    required: true
  registry-token:
    required: true
runs:
  using: composite
  steps:
    - uses: ./.forgejo/actions/registry-login
      with:
        registry: ${{ inputs.registry }}
        registry-user: ${{ inputs.registry-user }}
        registry-token: ${{ inputs.registry-token }}
    - shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE: ${{ inputs.image }}
        CHART: ${{ inputs.chart }}
        CHART_VERSION: ${{ inputs.chart-version }}
        ENVIRONMENT_TAG: ${{ inputs.environment }}
        SHA: ${{ inputs.sha }}
        WEB_ASSETS: ${{ inputs.web-assets }}
      run: |
        SHA="${SHA:-$GITHUB_SHA}"
        if [ "$WEB_ASSETS" = true ]; then
          ASSETS_BASE_URL="${STATIC_PUBLIC_BASE_URL%/}/web/${ENVIRONMENT_TAG}"
          crane export "$REGISTRY/$IMAGE:$SHA" - | tar -x app/dist/client
          node .gitlab/ci/scripts/publish-web-assets.mjs app/dist/client "web/${ENVIRONMENT_TAG}" "$ASSETS_BASE_URL"
        fi
        crane tag "$REGISTRY/$IMAGE:$SHA" "$ENVIRONMENT_TAG"
        crane tag "$REGISTRY/charts/$CHART:$CHART_VERSION" "$ENVIRONMENT_TAG"
