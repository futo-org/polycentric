name: Staging

# Staging branches, manual runs and the nightly schedule: the component
# workflows with their staging deploys; changes.mjs builds their plan.

on:
  workflow_dispatch:
    inputs:
      eas_staging:
        description: Build the staging apps on EAS (apk, aab, ios)
        type: boolean
        default: false
      ios_e2e:
        description: Run the iOS e2e suite on the store build
        type: boolean
        default: false
  push:
    branches: [develop]
  schedule:
    - cron: '0 6 * * *'

# Manual runs get their own group so a push does not cancel an EAS build.
concurrency:
  group: staging-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
  cancel-in-progress: false

jobs:
  changes:
    name: Plan
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      ref_slug: ${{ steps.plan.outputs.ref_slug }}
      images_tag: ${{ steps.plan.outputs.images_tag }}
      default_branch: ${{ steps.plan.outputs.default_branch }}
      default_ref: ${{ steps.plan.outputs.default_ref }}
      plan: ${{ steps.plan.outputs.plan }}
      images_missing: ${{ steps.plan.outputs.images_missing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.forgejo/actions/plan
        id: plan
        with:
          staging-branches: ${{ vars.CI_STAGING_BRANCHES }}
          event-before: ${{ github.event.before }}
          eas-staging: ${{ inputs.eas_staging }}
          ios-e2e: ${{ inputs.ios_e2e }}

  # Always runs (a skipped job breaks Forgejo's matrix expansion downstream);
  # the step only when an image tag is missing.
  setup-images:
    name: Build CI images
    needs: changes
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    steps:
      - uses: ./.forgejo/actions/ci-images
        if: needs.changes.outputs.images_missing == 'true'
        with:
          registry: ${{ needs.changes.outputs.registry }}
          tag: ${{ needs.changes.outputs.images_tag }}
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          cosign-key: ${{ secrets.COSIGN_PRIVATE_KEY }}

  checks:
    name: Checks
    needs: [changes, setup-images]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.setup-images.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-checks.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}

  packages:
    name: Packages
    needs: [changes, setup-images]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.setup-images.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-packages.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      registry: ${{ needs.changes.outputs.registry }}
      images_tag: ${{ needs.changes.outputs.images_tag }}
      default_branch: ${{ needs.changes.outputs.default_branch }}
      default_ref: ${{ needs.changes.outputs.default_ref }}

  # Components deploy to staging right after their build; they need the chart.
  rust-services:
    name: Rust services
    needs: [changes, setup-images, charts]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.setup-images.result != 'failure' &&
      needs.charts.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-rust-services.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      registry: ${{ needs.changes.outputs.registry }}
      images_tag: ${{ needs.changes.outputs.images_tag }}
      ref_slug: ${{ needs.changes.outputs.ref_slug }}
      default_branch: ${{ needs.changes.outputs.default_branch }}
      default_ref: ${{ needs.changes.outputs.default_ref }}
      chart_version: ${{ needs.charts.outputs.chart_version }}

  js-services:
    name: JS services
    needs: [changes, packages, charts]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.packages.result != 'failure' &&
      needs.charts.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-js-services.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      registry: ${{ needs.changes.outputs.registry }}
      ref_slug: ${{ needs.changes.outputs.ref_slug }}
      default_ref: ${{ needs.changes.outputs.default_ref }}
      chart_version: ${{ needs.charts.outputs.chart_version }}

  app-web-checks:
    name: App & web checks
    needs: changes
    uses: ./.forgejo/workflows/ci-app-web-checks.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  web:
    name: Web
    needs: [changes, packages, charts, app-web-checks]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.packages.result != 'failure' &&
      needs.charts.result != 'failure' && needs.app-web-checks.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-web.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      registry: ${{ needs.changes.outputs.registry }}
      ref_slug: ${{ needs.changes.outputs.ref_slug }}
      default_ref: ${{ needs.changes.outputs.default_ref }}
      is_tag: 'false'
      chart_version: ${{ needs.charts.outputs.chart_version }}

  app:
    name: App
    needs: [changes, packages, app-web-checks]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.packages.result != 'failure' &&
      needs.app-web-checks.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-app.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      is_tag: 'false'

  charts:
    name: Charts
    needs: changes
    uses: ./.forgejo/workflows/ci-charts.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      registry: ${{ needs.changes.outputs.registry }}
      ref_slug: ${{ needs.changes.outputs.ref_slug }}

  docs:
    name: Docs
    needs: changes
    uses: ./.forgejo/workflows/ci-docs.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  cd-docs:
    name: Docs deploy
    needs: [changes, docs]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.docs.result != 'failure' }}
    uses: ./.forgejo/workflows/cd-docs.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
