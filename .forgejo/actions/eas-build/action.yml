name: eas-build
description: Queues an EAS build of apps/harbor on top of the CI-built SDK artifacts (GitLab .app-eas-build); its id lands in apps/harbor/eas-build.json. Needs EXPO_TOKEN and, on tags, CI_COMMIT_TAG in env.
inputs:
  platform:
    required: true
  profile:
    required: true
runs:
  using: composite
  steps:
    - uses: ./.forgejo/actions/sdk-artifacts
      with:
        rn-sdk: 'true'
    - uses: ./.forgejo/actions/setup-pnpm
      with:
        install-args: --filter polycentric-app...
    - shell: bash
      env:
        EAS_PLATFORM: ${{ inputs.platform }}
        EAS_PROFILE: ${{ inputs.profile }}
      run: |
        APP_VERSION=$(node tools/expo/resolve-version.js)
        echo "Building app version ${APP_VERSION}"
        cd apps/harbor
        npx eas-cli build --platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive --no-wait --json > eas-build.json
