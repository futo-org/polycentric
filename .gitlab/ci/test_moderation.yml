# Moderation integration tests
#
# Runs the integration tests `csam_pipeline` and `report_label_pipeline`
# for the moderation service, which require a live stack. See their
# definitions at `services/moderation/tests/`.

.moderation-integration-workflow:
  image:
    name: $RUST_DIND_IMAGE
    pull_policy: if-not-present
  stage: test
  # Enforce serial execution of integration tests that share the same Docker
  # Compose project (postgres, rustfs, kafka, server) — the two integration
  # pipelines must never run concurrently or they tear down each other's stack.
  resource_group: docker-compose-integration
  rules:
    - if: $CI_COMMIT_TAG =~ /^moderation-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - services/moderation/**/*
        - services/server/**/*
        - compose.yml
        - .gitlab/ci/test_moderation.yml
        - .gitlab/ci/scripts/integration-moderation.sh
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - services/moderation/**/*
        - services/server/**/*
        - compose.yml
        - .gitlab/ci/test_moderation.yml
        - .gitlab/ci/scripts/integration-moderation.sh
  variables:
    RUNNER_SCRIPT_TIMEOUT: 30m
    # This commit's server image, else the default branch's.
    POLYCENTRIC_SERVER_IMAGE: ${CI_REGISTRY_IMAGE}/server:${CI_COMMIT_SHA}
    POLYCENTRIC_SERVER_FALLBACK_IMAGE: ${CI_REGISTRY_IMAGE}/server:${CI_DEFAULT_BRANCH}
  needs:
    - job: server-image
      artifacts: false
      optional: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

moderation-integration:
  extends: .moderation-integration-workflow
  script:
    - .gitlab/ci/scripts/integration-moderation.sh
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
