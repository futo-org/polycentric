name: Deploy production

# GitLab's manual production deploys: relabels a commit's image and chart.

on:
  workflow_dispatch:
    inputs:
      component:
        description: What to deploy
        type: choice
        required: true
        options:
          - server
          - moderation-service
          - push-notifications-service
          - scraper
          - verifier-bot
          - web
      sha:
        description: Commit to deploy (default the ref's head)
        type: string
        default: ''

concurrency:
  group: cd-production-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.component }} to production
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    env:
      STATIC_S3_ENDPOINT: ${{ secrets.STATIC_S3_ENDPOINT }}
      STATIC_S3_BUCKET: ${{ vars.STATIC_S3_BUCKET }}
      STATIC_S3_ACCESS_KEY_ID: ${{ secrets.STATIC_S3_ACCESS_KEY_ID }}
      STATIC_S3_SECRET_ACCESS_KEY: ${{ secrets.STATIC_S3_SECRET_ACCESS_KEY }}
      STATIC_PUBLIC_BASE_URL: ${{ vars.STATIC_PUBLIC_BASE_URL }}
    steps:
      - name: Install tools
        run: apk add --no-cache bash git curl crane
      - uses: actions/checkout@v4
      - name: Resolve target
        id: target
        env:
          COMPONENT: ${{ inputs.component }}
          SHA: ${{ inputs.sha }}
          REGISTRY: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}
        run: |
          case "$COMPONENT" in
            server) chart=harbor-server ;;
            moderation-service) chart=harbor-moderation ;;
            push-notifications-service) chart=harbor-push-notifications ;;
            scraper) chart=harbor-scraper ;;
            verifier-bot) chart=harbor-verifier-bot ;;
            web) chart=harbor-web ;;
          esac
          {
            echo "registry=$REGISTRY"
            echo "chart=$chart"
            echo "sha=${SHA:-$GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ steps.target.outputs.registry }}
          image: ${{ inputs.component }}
          chart: ${{ steps.target.outputs.chart }}
          chart-version: ${{ steps.target.outputs.sha }}
          sha: ${{ steps.target.outputs.sha }}
          environment: production
          web-assets: ${{ inputs.component == 'web' }}
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
