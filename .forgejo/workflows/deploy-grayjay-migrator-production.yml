name: Deploy grayjay migrator to production

# Moves the staging image and chart tags to production, or a commit's.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy instead of what staging runs (its image and chart must exist)
        type: string
        default: ''

concurrency:
  group: deploy-grayjay-migrator-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    steps:
      - name: Install tools
        run: apk add --no-cache bash git curl crane
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}
          image: grayjay-migrator
          chart: harbor-grayjay-migrator
          chart-version: ${{ inputs.sha || 'staging' }}
          tag: ${{ inputs.sha || 'staging' }}
          environment: production
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
