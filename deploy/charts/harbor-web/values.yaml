replicaCount: 2

image:
  # Built by the web-image CI job from apps/harbor/Dockerfile.
  repository: registry.futo.org/harbor/web
  # Defaults to the chart's appVersion — charts-publish packages every chart
  # with --app-version $CI_COMMIT_SHA, pinning the image built from the same
  # commit. Deploys happen by re-tagging the *chart* per environment
  # (staging / production), not the image.
  tag: ""
  # SHA tags are immutable, so no need to re-pull.
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

# Extra environment variables for the server container.
env: []

# The port server.js listens on (PORT env in the Dockerfile).
containerPort: 8080

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: harbor.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

# The server has no dedicated health endpoint; probing / serves the SPA
# index from disk.
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

nodeSelector: {}

tolerations: []

affinity: {}
