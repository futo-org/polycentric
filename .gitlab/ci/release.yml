.release-workflow:
  rules:
    # Only fire on SemVer release tags, e.g. v2.0.0 or v2.0.0-alpha.1.
    # NOTE: intentionally has no trailing `when: never` so it can be safely
    # `!reference`d into the build jobs' rule lists without short-circuiting them.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
      when: always

################
# Android APK  #
################

release-android-apk:
  extends: .release-workflow
  stage: publish
  image: alpine:latest
  needs:
    - job: app-android-apk-production
      artifacts: true
  before_script:
    - apk add --no-cache curl
  script:
    - |
      APK_PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/harbor-android/${CI_COMMIT_TAG}/harbor-${CI_COMMIT_TAG}.apk"
      echo "Uploading APK to ${APK_PACKAGE_URL}"
      curl -fsSL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file apps/harbor/harbor.apk "$APK_PACKAGE_URL"
      echo "APK_PACKAGE_URL=${APK_PACKAGE_URL}" > apk.env
  artifacts:
    reports:
      dotenv: apk.env

####################
# Container images #
####################

.release-tag-image:
  extends: .release-workflow
  stage: release
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
    - crane tag $CI_REGISTRY_IMAGE/$IMAGE:$CI_COMMIT_SHA $CI_COMMIT_TAG

release-tag-web-image:
  extends: .release-tag-image
  variables:
    IMAGE: web
  needs:
    - job: web-image
      artifacts: false

release-tag-server-image:
  extends: .release-tag-image
  variables:
    IMAGE: server
  needs:
    - job: server-image
      artifacts: false

##########################
# JS SDKs + React Native #
##########################

release-publish-npm:
  extends: .release-workflow
  stage: publish
  image: node:24-slim
  needs:
    - job: rs-core-libraries
      artifacts: true
    - job: js-sdks-build
      artifacts: true
    - job: rn-sdk-build
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - npm install -g pnpm@10
    - pnpm config set @polycentric:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> ~/.npmrc
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
    - pnpm install --frozen-lockfile
  script:
    - .gitlab/ci/scripts/npm_publish.sh

#################
# rs-core crate #
#################

release-publish-rs-core:
  extends: .release-workflow
  stage: publish
  image:
    name: $RUST_IMAGE
    pull_policy: if-not-present
  variables:
    GIT_DEPTH: "1"
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    # Bump the crate versions and give the path dependency a version so the
    # crates package cleanly.
    - sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" packages/rs-common/Cargo.toml packages/rs-core/Cargo.toml
    - sed -i "s#path = \"../rs-common\" }#path = \"../rs-common\", version = \"${VERSION}\" }#" packages/rs-core/Cargo.toml
    - mkdir -p target/package
    - cargo package -p polycentric-common --no-verify --allow-dirty || true
    - cargo package -p polycentric-core --no-verify --allow-dirty || true
    # Fall back to a source tarball if cargo could not package the crate.
    - |
      if ! ls target/package/*.crate >/dev/null 2>&1; then
        echo "cargo package produced no .crate; falling back to a source tarball" >&2
        tar czf "target/package/polycentric-core-${VERSION}.crate" packages/rs-core packages/rs-common
      fi
    - |
      BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/polycentric-rs-core/${VERSION}"
      for crate in target/package/*.crate; do
        fname=$(basename "$crate")
        echo "Uploading ${fname}"
        curl -fsSL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$crate" "${BASE_URL}/${fname}"
      done
      echo "RS_CORE_PACKAGE_URL=${BASE_URL}/polycentric-core-${VERSION}.crate" > rs-core.env
  artifacts:
    reports:
      dotenv: rs-core.env

#############
# Changelog #
#############

release-changelog:
  extends: .release-workflow
  stage: publish
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - 'curl -H "PRIVATE-TOKEN: $CI_API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?version=$CI_COMMIT_TAG" | jq -r .notes > release_notes.md'
    - cat release_notes.md
  artifacts:
    paths:
      - release_notes.md
    expire_in: 1 week

#############################
# Create the GitLab Release #
#############################

release:
  extends: .release-workflow
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release"
  needs:
    - job: release-changelog
      artifacts: true
    - job: release-android-apk
      artifacts: true
    - job: kt-core-publish
      artifacts: true
    - job: release-publish-rs-core
      artifacts: false
    - job: release-publish-npm
      artifacts: false
    - job: release-tag-web-image
      artifacts: false
    - job: release-tag-server-image
      artifacts: false
  release:
    tag_name: $CI_COMMIT_TAG
    name: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_SHA"
    description: release_notes.md
    assets:
      links:
        - name: "Android APK ($CI_COMMIT_TAG)"
          url: "$APK_PACKAGE_URL"
          link_type: package
          filepath: "/harbor-android.apk"
        - name: "Kotlin SDK AAR ($CI_COMMIT_TAG)"
          url: "$KT_CORE_PACKAGE_URL"
          link_type: package
          filepath: "/polycentric-core.aar"

#################################
# Announce the release on chat  #
#################################

# GitLab's Mattermost integration has no release event, so post it ourselves.
release-announce:
  extends: .release-workflow
  stage: release
  image: alpine:latest
  needs:
    - job: release
      artifacts: false
    - job: release-changelog
      artifacts: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      jq -n --arg tag "$CI_COMMIT_TAG" \
            --arg url "$CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG" \
            --rawfile notes release_notes.md \
            '{text: ("### [Harbor \($tag)](\($url)) released\n\n" + ($notes | .[0:6000]))}' \
        | curl -fsS -H "Content-Type: application/json" -d @- "$MATTERMOST_RELEASES_WEBHOOK"
