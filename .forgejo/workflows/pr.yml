name: PR

# Pull requests: the component workflows without deploys; changes.mjs builds
# their plan.

on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Plan
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      ref_slug: ${{ steps.plan.outputs.ref_slug }}
      images_tag: ${{ steps.plan.outputs.images_tag }}
      default_branch: ${{ steps.plan.outputs.default_branch }}
      default_ref: ${{ steps.plan.outputs.default_ref }}
      plan: ${{ steps.plan.outputs.plan }}
      images_missing: ${{ steps.plan.outputs.images_missing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.forgejo/actions/plan
        id: plan

  # Always runs (a skipped job breaks Forgejo's matrix expansion downstream);
  # the step only when an image tag is missing.
  setup-images:
    name: Build CI images
    needs: changes
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    steps:
      - uses: ./.forgejo/actions/ci-images
        if: needs.changes.outputs.images_missing == 'true'
        with:
          registry: ${{ needs.changes.outputs.registry }}
          tag: ${{ needs.changes.outputs.images_tag }}
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          cosign-key: ${{ secrets.COSIGN_PRIVATE_KEY }}

  checks:
    name: Checks
    needs: [changes, setup-images]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.setup-images.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-checks.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}

  packages:
    name: Packages
    needs: [changes, setup-images]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.setup-images.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-packages.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      registry: ${{ needs.changes.outputs.registry }}
      images_tag: ${{ needs.changes.outputs.images_tag }}
      default_branch: ${{ needs.changes.outputs.default_branch }}
      default_ref: ${{ needs.changes.outputs.default_ref }}

  # No deploys on a PR, so no chart version.
  rust-services:
    name: Rust services
    needs: [changes, setup-images]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.setup-images.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-rust-services.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      registry: ${{ needs.changes.outputs.registry }}
      images_tag: ${{ needs.changes.outputs.images_tag }}
      ref_slug: ${{ needs.changes.outputs.ref_slug }}
      default_branch: ${{ needs.changes.outputs.default_branch }}
      default_ref: ${{ needs.changes.outputs.default_ref }}
      chart_version: ''

  js-services:
    name: JS services
    needs: [changes, packages]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.packages.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-js-services.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      registry: ${{ needs.changes.outputs.registry }}
      ref_slug: ${{ needs.changes.outputs.ref_slug }}
      default_ref: ${{ needs.changes.outputs.default_ref }}
      chart_version: ''

  app-web-checks:
    name: App & web checks
    needs: changes
    uses: ./.forgejo/workflows/ci-app-web-checks.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  web:
    name: Web
    needs: [changes, packages, app-web-checks]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.packages.result != 'failure' &&
      needs.app-web-checks.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-web.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      registry: ${{ needs.changes.outputs.registry }}
      ref_slug: ${{ needs.changes.outputs.ref_slug }}
      is_tag: 'false'
      chart_version: ''

  app:
    name: App
    needs: [changes, packages, app-web-checks]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.packages.result != 'failure' &&
      needs.app-web-checks.result != 'failure' }}
    uses: ./.forgejo/workflows/ci-app.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      is_tag: 'false'

  docs:
    name: Docs
    needs: changes
    uses: ./.forgejo/workflows/ci-docs.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  cd-docs:
    name: Docs preview
    needs: [changes, docs]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.docs.result != 'failure' }}
    uses: ./.forgejo/workflows/cd-docs.yml
    secrets: inherit
    with:
      plan: ${{ needs.changes.outputs.plan }}
      pr_number: ${{ github.event.pull_request.number }}

  # The branch protection status check: PR / Complete (pull_request). It runs
  # whatever the run did, so a PR with no jobs still reports.
  complete:
    name: Complete
    needs:
      - changes
      - setup-images
      - checks
      - packages
      - rust-services
      - js-services
      - app-web-checks
      - web
      - app
      - docs
      - cd-docs
    if: always()
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    steps:
      - name: Job results
        shell: sh
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = Object.entries(JSON.parse(process.env.RESULTS));
            for (const [name, job] of jobs) console.log(`${job.result}\t${name}`);
            const bad = jobs.filter(([, job]) => !["success", "skipped"].includes(job.result));
            if (!bad.length) process.exit(0);
            console.log(`::error::Not passing: ${bad.map(([n]) => n).join(", ")}`);
            process.exit(1);
          '
