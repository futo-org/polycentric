appId: ${MAESTRO_APP_ID}
---
# Cancels the verification request of the first verifier row (rows are in
# request order; the flow asserts by name which one went). The confirm is
# window.confirm, which the runner would dismiss, answering "no", so it is
# stubbed to say yes and record the prompt.
- evalBrowserScript:
    script: |
      window.confirmMessage = '';
      window.confirm = (message) => {
        window.confirmMessage = message;
        return true;
      };
      return true;
- tapOn:
    css: '[aria-label="${output.verifications.verifierOptions}"]'
# The menu has one item; the recorded prompt below checks it was the right one.
- tapOn:
    css: '[role="menuitem"]'
- evalBrowserScript:
    script: return window.confirmMessage
    output: confirmMessage
- assertTrue: ${confirmMessage.startsWith(output.verifications.cancelRequestTitle)}
