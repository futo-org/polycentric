[package]
name = "polycentric-core"
version = "0.0.0"
edition = "2024"
description = "Rust core for the Polycentric protocol"
license-file = "../../LICENSE"
repository = ""

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["native-transport"]
native-transport = [
    "tonic/transport",
    "tonic/channel",
    "tonic/tls-ring",
    "tonic/tls-webpki-roots",
    "dep:tokio",
]

[dependencies]
thiserror.workspace = true
prost.workspace = true
prost-types.workspace = true
polycentric-common.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2.workspace = true
image = "0.25.10"
async-trait = "0.1"
futures = "0.3"
futures-timer = { version = "3", features = ["wasm-bindgen"] }
tonic.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
uniffi.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tonic-web-wasm-client = "0.9"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
uniffi = { workspace = true, features = ["wasm-unstable-single-threaded"] }
uniffi-runtime-wasm = "0.31.0-5"
# The ubrn wasm player stages this cdylib through wasm-bindgen-cli-support,
# pinned to the same version in
# patches/uniffi-bindgen-react-native@0.31.0-5.patch. The bindgen schema
# versions must match exactly, so the two pins move together.
wasm-bindgen = "=0.2.127"

[dev-dependencies]
uniffi = { workspace = true, features = ["build"] }

[build-dependencies]
prost-build.workspace = true
