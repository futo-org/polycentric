name: Docs

# GitLab build_docs.yml. Deploys are cd-docs.yml.

on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true

jobs:
  docs-typecheck:
    name: Typecheck docs
    if: fromJSON(inputs.plan).flags.docs
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter=polycentric-docs...
      - name: Typecheck
        run: pnpm --filter=polycentric-docs run typecheck

  docs-build:
    name: Build docs
    if: fromJSON(inputs.plan).flags.docs
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter=polycentric-docs...
      - name: Build
        run: pnpm --filter=polycentric-docs run build
      - uses: forgejo/upload-artifact@v4
        with:
          name: docs-build
          path: docs/build
          retention-days: 7
