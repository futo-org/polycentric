name: Packages

# GitLab build_rs_core.yml, build_js_sdks.yml, build_rn_sdk.yml, build_kt_core.yml.

on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      registry:
        type: string
        required: true
      images_tag:
        type: string
        required: true
      default_branch:
        type: string
        required: true
      default_ref:
        type: string
        required: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  SCCACHE_R2_BUCKET: ${{ vars.SCCACHE_R2_BUCKET }}
  SCCACHE_R2_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
  SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
  SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}

jobs:
  rust-packages-lint:
    name: Packages / Lint Rust
    if: fromJSON(inputs.plan).flags.rs_core
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container:
      image: ${{ inputs.registry }}/ci/rust:${{ inputs.images_tag }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/rust-env
        with:
          cache: packages-lint
      - name: Format
        run: cargo fmt --check -p polycentric-core -p polycentric-common
      - name: Clippy
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p polycentric-common
          cargo clippy -p polycentric-core -- -D warnings
      - uses: ./.forgejo/actions/r2-cache
        if: always()
        continue-on-error: true
        with:
          mode: save
          key: ${{ env.RUST_CACHE_KEY }}
          path: ${{ env.RUST_CACHE_PATHS }}

  rust-packages-tests:
    name: Packages / Test Rust
    if: fromJSON(inputs.plan).flags.rs_core
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container:
      image: ${{ inputs.registry }}/ci/rust:${{ inputs.images_tag }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/rust-env
        with:
          cache: packages-tests
      - name: Tests
        run: cargo nextest run -P ci -p polycentric-core -p polycentric-common
      - uses: ./.forgejo/actions/r2-cache
        if: always()
        continue-on-error: true
        with:
          mode: save
          key: ${{ env.RUST_CACHE_KEY }}
          path: ${{ env.RUST_CACHE_PATHS }}
      - uses: forgejo/upload-artifact@v4
        if: always()
        with:
          name: junit-rust-packages
          path: target/nextest/ci/junit.xml
          retention-days: 7

  js-packages-lint:
    name: Packages / Lint JS
    if: fromJSON(inputs.plan).flags.js_sdk
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter polycentric
      - name: Biome
        run: pnpm exec biome check packages/js-core --diagnostic-level=error

  js-packages-tests:
    name: Packages / Test JS
    if: fromJSON(inputs.plan).flags.js_sdk
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter @polycentric/js-core...
      - name: js-core
        run: pnpm --filter @polycentric/js-core test:ci
      - uses: forgejo/upload-artifact@v4
        if: always()
        with:
          name: junit-js-core
          path: packages/js-core/junit.xml
          retention-days: 7

  rust-wasm-build:
    name: Packages / Build wasm
    needs: [rust-packages-lint, rust-packages-tests]
    if: >-
      ${{ !cancelled() && fromJSON(inputs.plan).flags.build_wasm &&
      needs.rust-packages-lint.result != 'failure' && needs.rust-packages-tests.result != 'failure' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container:
      image: ${{ inputs.registry }}/ci/rust:${{ inputs.images_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/rust-env
        with:
          cache: wasm
      - name: Install dependencies
        run: pnpm install --filter @polycentric/rs-core-wasm
      - name: wasm
        run: pnpm --filter @polycentric/rs-core-wasm build --release
      - uses: ./.forgejo/actions/r2-cache
        if: always()
        continue-on-error: true
        with:
          mode: save
          key: ${{ env.RUST_CACHE_KEY }}
          path: ${{ env.RUST_CACHE_PATHS }}
      - uses: forgejo/upload-artifact@v4
        with:
          name: rs-core-wasm-build
          path: |
            packages/rs-core-wasm/src/generated/wasm
            packages/rs-core-wasm/dist
          retention-days: 7

  # The Kotlin AAR builds the same Android targets, so it shares this job.
  rust-android-build:
    name: Packages / Build Android
    needs: [rust-packages-lint, rust-packages-tests]
    if: >-
      ${{ !cancelled() && fromJSON(inputs.plan).flags.build_rn &&
      needs.rust-packages-lint.result != 'failure' && needs.rust-packages-tests.result != 'failure' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container:
      image: ${{ inputs.registry }}/ci/rust-android:${{ inputs.images_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/rust-env
        with:
          cache: android
      - name: Install dependencies
        run: pnpm install --filter @polycentric/react-native
      - name: Android libraries
        run: pnpm --filter @polycentric/react-native ubrn:android --release
      - uses: ./.forgejo/actions/r2-cache
        if: always()
        continue-on-error: true
        with:
          mode: save
          key: ${{ env.RUST_CACHE_KEY }}
          path: ${{ env.RUST_CACHE_PATHS }}
      - uses: forgejo/upload-artifact@v4
        with:
          name: rn-android-build
          path: packages/react-native/android/src/main/jniLibs
          retention-days: 7

  kt-core-build:
    name: Packages / Build Kotlin
    needs: [rust-packages-lint, rust-packages-tests]
    if: >-
      ${{ !cancelled() && fromJSON(inputs.plan).flags.kt_core_build &&
      needs.rust-packages-lint.result != 'failure' && needs.rust-packages-tests.result != 'failure' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container:
      image: ${{ inputs.registry }}/ci/rust-android:${{ inputs.images_tag }}
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/rust-env
        with:
          cache: kt-core
      - uses: ./.forgejo/actions/r2-cache
        with:
          mode: restore
          key: gradle-${{ hashFiles('packages/kt-core/gradle/libs.versions.toml', 'packages/kt-core/gradle/wrapper/gradle-wrapper.properties') }}
          path: |
            .gradle/wrapper
            .gradle/caches
      - name: Kotlin AAR
        run: cd packages/kt-core && ./gradlew :core:assembleRelease
      - uses: ./.forgejo/actions/r2-cache
        with:
          mode: save
          key: gradle-${{ hashFiles('packages/kt-core/gradle/libs.versions.toml', 'packages/kt-core/gradle/wrapper/gradle-wrapper.properties') }}
          path: |
            .gradle/wrapper
            .gradle/caches
      - uses: ./.forgejo/actions/r2-cache
        if: always()
        continue-on-error: true
        with:
          mode: save
          key: ${{ env.RUST_CACHE_KEY }}
          path: ${{ env.RUST_CACHE_PATHS }}
      - uses: forgejo/upload-artifact@v4
        with:
          name: kt-core-build
          path: packages/kt-core/core/build/
          retention-days: 7

  # Runs inside an ephemeral Tart macOS VM (see forgejo-tart-runner), so the
  # .cirrus.yml build steps run directly here instead of via `cirrus run`.
  rn-ios-build:
    name: Packages / Build iOS
    if: fromJSON(inputs.plan).flags.build_rn
    runs-on: ${{ vars.CI_RUNNER_MACOS || 'macos' }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
          source "$CARGO_HOME/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          brew install just protobuf cmake ninja clang-format pnpm
      - name: Build iOS libraries
        working-directory: packages/react-native
        run: |
          source "$CARGO_HOME/env"
          pnpm i
          pnpm ubrn:ios
      - uses: forgejo/upload-artifact@v4
        with:
          name: rn-ios-build
          path: |
            packages/react-native/ios
            packages/react-native/PolycentricReactNativeFramework.xcframework
          retention-days: 7

  # Libraries this run did not build come from the develop copy.
  js-packages-build:
    name: Packages / Build JS
    needs: [rust-wasm-build, rust-android-build, rn-ios-build, js-packages-lint, js-packages-tests]
    if: >-
      ${{ !cancelled() && fromJSON(inputs.plan).flags.build_sdks &&
      needs.rust-wasm-build.result != 'failure' && needs.rust-android-build.result != 'failure' &&
      needs.rn-ios-build.result != 'failure' && needs.js-packages-lint.result != 'failure' &&
      needs.js-packages-tests.result != 'failure' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    env:
      REGISTRY: ${{ inputs.registry }}
      DEFAULT_BRANCH: ${{ inputs.default_branch }}
      CRANE_VERSION: 0.22.1
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
    steps:
      - uses: actions/checkout@v4
      - name: Install crane
        run: |
          curl -fsSL -o crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/v$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  crane.tar.gz" | sha256sum -c
          tar xzf crane.tar.gz -C /usr/local/bin crane
      - if: needs.rust-wasm-build.result == 'success'
        uses: forgejo/download-artifact@v4
        with:
          name: rs-core-wasm-build
          path: packages/rs-core-wasm
      - if: fromJSON(inputs.plan).flags.build_rn && needs.rust-android-build.result == 'success'
        uses: forgejo/download-artifact@v4
        with:
          name: rn-android-build
          path: packages/react-native/android/src/main/jniLibs
      - if: needs.rn-ios-build.result == 'success'
        uses: forgejo/download-artifact@v4
        with:
          name: rn-ios-build
          path: packages/react-native
      - uses: ./.forgejo/actions/registry-login
        with:
          registry: ${{ inputs.registry }}
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Fetch libraries not built by this run
        run: .forgejo/scripts/rs-core-libraries.sh fetch
      - name: Publish libraries
        if: inputs.default_ref == 'true'
        run: .forgejo/scripts/rs-core-libraries.sh publish
      - uses: forgejo/upload-artifact@v4
        with:
          name: rs-core-libraries
          path: |
            packages/rs-core-wasm/src/generated/wasm
            packages/rs-core-wasm/dist
            packages/react-native/android/src/main/jniLibs
            packages/react-native/ios
            packages/react-native/PolycentricReactNativeFramework.xcframework
          retention-days: 7
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter ./packages/js-*... --filter @polycentric/react-native...
      - name: JS SDKs
        run: pnpm --filter='./packages/js-*' run build
      - uses: forgejo/upload-artifact@v4
        with:
          name: js-sdks-dist
          path: packages/js-*/dist
          retention-days: 7
      - name: React Native SDK
        if: fromJSON(inputs.plan).flags.build_rn_sdk
        run: pnpm --filter @polycentric/react-native build
      - uses: forgejo/upload-artifact@v4
        if: fromJSON(inputs.plan).flags.build_rn_sdk
        with:
          name: rn-sdk
          path: |
            packages/react-native
            !packages/react-native/node_modules
          retention-days: 7
