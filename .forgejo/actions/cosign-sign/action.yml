name: cosign-sign
description: Signs pushed images/charts with the harbor-infra cosign key (cosign-sign.sh); a no-op when the key is absent.
inputs:
  refs:
    description: Image refs to sign, one per line (tags are resolved to digests)
    required: true
  key:
    description: COSIGN_PRIVATE_KEY (base64 PEM); empty skips signing
    default: ''
  cosign-version:
    description: cosign release for non-alpine job images
    default: '2.5.3'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        COSIGN_VERSION: ${{ inputs.cosign-version }}
      run: |
        command -v cosign >/dev/null && exit 0
        if command -v apk >/dev/null; then
          apk add --no-cache cosign
        else
          curl -fsSL -o /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          chmod 0755 /usr/local/bin/cosign
        fi
    - shell: bash
      env:
        REFS: ${{ inputs.refs }}
        COSIGN_PRIVATE_KEY: ${{ inputs.key }}
      run: |
        refs=()
        while IFS= read -r ref; do [ -n "$ref" ] && refs+=("$ref"); done <<< "$REFS"
        .forgejo/scripts/cosign-sign.sh "${refs[@]}"
