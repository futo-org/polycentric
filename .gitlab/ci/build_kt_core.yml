# Kotlin SDK (packages/kt-core): compile the AAR on code changes and
# publish it to the project's Maven package registry on tag pipelines.
.kt-core-workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Cargo.lock
        - packages/kt-core/**/*
        - packages/rs-core/**/*
        - packages/rs-common/**/*
        - protos/**/*
        - .gitlab/ci/build_kt_core.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.lock
        - packages/kt-core/**/*
        - packages/rs-core/**/*
        - packages/rs-common/**/*
        - protos/**/*
        - .gitlab/ci/build_kt_core.yml

# Shared image/cache/toolchain setup for the Gradle build. The cargo cache
# is the same self-populating pattern as rn-android-build; the Gradle cache
# keys on the version catalog so dependency updates invalidate it.
.kt-core-gradle:
  image:
    name: $RUST_ANDROID_IMAGE
    pull_policy: if-not-present
  variables:
    GRADLE_USER_HOME: ${CI_PROJECT_DIR}/.gradle
  cache:
    - key:
        files:
          - Cargo.lock
        prefix: cargo-${CI_JOB_NAME}
      paths:
        - .cargo/registry/index
        - .cargo/registry/cache
        - .cargo/git/db
        - .sccache
      policy: pull-push
    - key:
        files:
          - packages/kt-core/gradle/libs.versions.toml
        prefix: gradle-${CI_JOB_NAME}
      paths:
        - .gradle/wrapper
        - .gradle/caches
      policy: pull-push
  before_script:
    - command -v sccache >/dev/null && export RUSTC_WRAPPER=sccache || true
    - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    - cd packages/kt-core

# Compilation test for all MRs, default-branch changes to relevant code,
# and tag pipelines.
kt-core-build:
  extends: .kt-core-gradle
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - !reference [.kt-core-workflow, rules]
  script:
    - ./gradlew :core:assembleRelease
  artifacts:
    paths:
      - packages/kt-core/core/build/
    expire_in: 1 week

# Publish to the GitLab Maven registry on any tag pipeline.
kt-core-publish:
  extends: .kt-core-gradle
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: kt-core-build
      artifacts: true
  script:
    # Consumes the build dir produced by kt-core-build
    - ./gradlew :core:publishReleasePublicationToGitLabRepository -PktCoreVersion="${CI_COMMIT_TAG#v}"
    # URL for the release asset link in release.yml--make sure that the ENV gets added to the root
    # CI directory
    - echo "KT_CORE_PACKAGE_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven/org/futo/polycentric-core/${CI_COMMIT_TAG#v}/polycentric-core-${CI_COMMIT_TAG#v}.aar" > "${CI_PROJECT_DIR}/kt-core.env"
  artifacts:
    reports:
      dotenv: kt-core.env
