.service-rust-base:
  image:
    name: ${RUST_IMAGE}
    pull_policy: if-not-present
  stage: check
  variables:
    SCCACHE_DIR: ${CI_PROJECT_DIR}/.sccache
  before_script:
    - command -v sccache >/dev/null && export RUSTC_WRAPPER=sccache || true
  # Self-populating per job: the first run downloads and compiles
  # everything and uploads the result; every run after starts with warm
  # crate sources and sccache hits for unchanged crates.
  cache:
    key:
      files:
        - Cargo.lock
      prefix: cargo-${CI_JOB_NAME}
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      - .sccache
    policy: pull-push

.service-format-check:
  extends: .service-rust-base
  script:
    - cargo fmt --check --package ${SERVICE_NAME}
  allow_failure: true

.service-clippy:
  extends: .service-rust-base
  script:
    - cargo clippy --package ${SERVICE_NAME} -- -D warnings
  allow_failure: true

.service-test:
  extends: .service-rust-base
  script:
    - cargo nextest run -P ci --package ${SERVICE_NAME}
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml

.service-image:
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  stage: build
  script:
    # The default branch also gets a moving tag, used as the integration
    # tests' fallback image.
    - |
      NAMES="$CI_REGISTRY_IMAGE/${SERVICE_NAME}:$CI_COMMIT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        NAMES="$NAMES,$CI_REGISTRY_IMAGE/${SERVICE_NAME}:$CI_DEFAULT_BRANCH"
      fi
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=./services/${SERVICE_DIR} \
        --import-cache type=registry,ref=$CI_REGISTRY_IMAGE/${SERVICE_NAME}:cache-$CI_DEFAULT_BRANCH \
        --import-cache type=registry,ref=$CI_REGISTRY_IMAGE/${SERVICE_NAME}:cache-$CI_COMMIT_REF_SLUG \
        --export-cache type=registry,ref=$CI_REGISTRY_IMAGE/${SERVICE_NAME}:cache-$CI_COMMIT_REF_SLUG,mode=max \
        --output "type=image,\"name=$NAMES\",push=true"

########################################################################
# server
########################################################################

.server-workflow:
  image: gitlab.futo.org:5050/devops/manifest-repo/library/docker:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^server-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Cargo.toml
        - Cargo.lock
        - services/server/**/*
        - services/common/**/*
        # Charts pin this commit's image SHA (appVersion), so the image must
        # exist even for chart-only changes.
        - deploy/charts/**/*
        # The integration tests run this commit's image.
        - compose.yml
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
        - .gitlab/ci/publish_charts.yml
        - .gitlab/ci/test_server.yml
        - .gitlab/ci/scripts/integration-server.sh
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
        - Cargo.lock
        - services/server/**/*
        - services/common/**/*
        - deploy/charts/**/*
        - compose.yml
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
        - .gitlab/ci/publish_charts.yml
        - .gitlab/ci/test_server.yml
        - .gitlab/ci/scripts/integration-server.sh
  variables:
    RUNNER_SCRIPT_TIMEOUT: 179m
    SERVICE_NAME: server
    SERVICE_DIR: server

server-format-check:
  extends:
    - .server-workflow
    - .service-format-check

server-clippy:
  extends:
    - .server-workflow
    - .service-clippy

server-image:
  extends:
    - .server-workflow
    - .service-image
  rules:
    - !reference [.server-workflow, rules]
    - !reference [.release-workflow, rules]

