name: Deploy to production

# Manual: relabels a commit's images and charts production, one step per
# component picked.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (default the ref's head)
        type: string
        default: ''
      server:
        type: boolean
        default: false
      moderation:
        type: boolean
        default: false
      push_notifications:
        type: boolean
        default: false
      scraper:
        type: boolean
        default: false
      verifier_bot:
        type: boolean
        default: false
      web:
        type: boolean
        default: false

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    env:
      REGISTRY: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}
      SHA: ${{ inputs.sha || github.sha }}
      STATIC_S3_ENDPOINT: ${{ secrets.STATIC_S3_ENDPOINT }}
      STATIC_S3_BUCKET: ${{ vars.STATIC_S3_BUCKET }}
      STATIC_S3_ACCESS_KEY_ID: ${{ secrets.STATIC_S3_ACCESS_KEY_ID }}
      STATIC_S3_SECRET_ACCESS_KEY: ${{ secrets.STATIC_S3_SECRET_ACCESS_KEY }}
      STATIC_PUBLIC_BASE_URL: ${{ vars.STATIC_PUBLIC_BASE_URL }}
    steps:
      - name: Install tools
        run: apk add --no-cache bash git curl crane
      - uses: actions/checkout@v4
      - name: Server
        if: inputs.server
        uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: server
          chart: harbor-server
          chart-version: ${{ env.SHA }}
          sha: ${{ env.SHA }}
          environment: production
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Moderation
        if: inputs.moderation
        uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: moderation-service
          chart: harbor-moderation
          chart-version: ${{ env.SHA }}
          sha: ${{ env.SHA }}
          environment: production
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Push notifications
        if: inputs.push_notifications
        uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: push-notifications-service
          chart: harbor-push-notifications
          chart-version: ${{ env.SHA }}
          sha: ${{ env.SHA }}
          environment: production
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Scraper
        if: inputs.scraper
        uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: scraper
          chart: harbor-scraper
          chart-version: ${{ env.SHA }}
          sha: ${{ env.SHA }}
          environment: production
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Verifier bot
        if: inputs.verifier_bot
        uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: verifier-bot
          chart: harbor-verifier-bot
          chart-version: ${{ env.SHA }}
          sha: ${{ env.SHA }}
          environment: production
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Web
        if: inputs.web
        uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: web
          chart: harbor-web
          chart-version: ${{ env.SHA }}
          sha: ${{ env.SHA }}
          environment: production
          web-assets: 'true'
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
