name: App

# GitLab build_app.yml.

on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      registry:
        type: string
        required: true
      ref_slug:
        type: string
        required: true
      is_tag:
        type: string
        required: true
      chart_version:
        type: string
        required: true

jobs:
  web-image:
    name: Build web image
    if: fromJSON(inputs.plan).flags.web_image
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    steps:
      - name: Install tools
        run: apk add --no-cache bash git docker-cli docker-cli-buildx
      - uses: actions/checkout@v4
      # Release tags use the tag; other builds the next patch plus the commit.
      - name: Resolve version
        id: version
        env:
          CI_COMMIT_TAG: ${{ inputs.is_tag == 'true' && github.ref_name || '' }}
        run: |
          APP_VERSION=$(node tools/expo/resolve-version.js)
          if [ -z "$CI_COMMIT_TAG" ]; then APP_VERSION="${APP_VERSION}+$(echo "$GITHUB_SHA" | cut -c1-8)"; fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: ./.forgejo/actions/sdk-artifacts
        with:
          rn-sdk: 'true'
      - uses: ./.forgejo/actions/service-image
        with:
          image: web
          dockerfile: apps/harbor
          registry: ${{ inputs.registry }}
          ref-slug: ${{ inputs.ref_slug }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            EXPO_PUBLIC_POLYCENTRIC_SEED_SERVERS=${{ vars.EXPO_PUBLIC_POLYCENTRIC_SEED_SERVERS }}
            EXPO_PUBLIC_POLYCENTRIC_VERIFIER_SERVERS=${{ vars.EXPO_PUBLIC_POLYCENTRIC_VERIFIER_SERVERS }}
            SKIP_WORKSPACE_BUILD=1
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

  # Drives the web image this run built, started as a job service.
  app-web-e2e:
    name: Test web e2e
    needs: web-image
    if: fromJSON(inputs.plan).flags.web_e2e
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    services:
      web:
        image: ${{ inputs.registry }}/web:${{ github.sha }}
        env:
          EXPO_PUBLIC_APP_VARIANT: staging
          EXPO_PUBLIC_POLYCENTRIC_SEED_SERVERS: https://srv.staging.harbor.social,https://srv.staging.polycentric.io
    env:
      MAESTRO_WEB_URL: http://web:8080
      MAESTRO_BROWSER: /usr/local/bin/e2e-chromium
      MAESTRO_OUTPUT: reports
    steps:
      - name: Install Chromium
        run: |
          apt-get update && apt-get install -y --no-install-recommends chromium
          printf '#!/bin/sh\nexec /usr/bin/chromium --no-sandbox --unsafely-treat-insecure-origin-as-secure=%s "$@"\n' "$MAESTRO_WEB_URL" > "$MAESTRO_BROWSER"
          chmod +x "$MAESTRO_BROWSER"
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter harbor-e2e...
      - name: Web e2e
        run: pnpm --filter harbor-e2e test:web
      - uses: forgejo/upload-artifact@v4
        if: always()
        with:
          name: e2e-web-report
          path: e2e/reports
          retention-days: 7

  web-deploy:
    name: Deploy web to staging
    needs: web-image
    if: ${{ !cancelled() && fromJSON(inputs.plan).flags.deploy_web && needs.web-image.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:24-alpine' }}
    env:
      STATIC_S3_ENDPOINT: ${{ secrets.STATIC_S3_ENDPOINT }}
      STATIC_S3_BUCKET: ${{ vars.STATIC_S3_BUCKET }}
      STATIC_S3_ACCESS_KEY_ID: ${{ secrets.STATIC_S3_ACCESS_KEY_ID }}
      STATIC_S3_SECRET_ACCESS_KEY: ${{ secrets.STATIC_S3_SECRET_ACCESS_KEY }}
      STATIC_PUBLIC_BASE_URL: ${{ vars.STATIC_PUBLIC_BASE_URL }}
    steps:
      - name: Install tools
        run: apk add --no-cache bash git curl crane
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ inputs.registry }}
          image: web
          chart: harbor-web
          chart-version: ${{ inputs.chart_version }}
          environment: staging
          web-assets: 'true'
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

  # Store builds only queue on EAS, so their submit jobs follow right away
  # and EAS waits for the build itself.
  app-eas-store:
    name: ${{ matrix.label }}
    if: fromJSON(inputs.plan).flags.eas_store
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).matrix.eas_store }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI_COMMIT_TAG: ${{ inputs.is_tag == 'true' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/eas-build
        with:
          platform: ${{ matrix.platform }}
          profile: ${{ matrix.profile }}
      - uses: forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: apps/harbor/eas-build.json
          retention-days: 7

  app-eas-apk:
    name: ${{ matrix.label }}
    if: fromJSON(inputs.plan).flags.eas_apk
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).matrix.eas_apk }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI_COMMIT_TAG: ${{ inputs.is_tag == 'true' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/eas-build
        with:
          platform: ${{ matrix.platform }}
          profile: ${{ matrix.profile }}
          wait: 'true'
      - uses: forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            apps/harbor/eas-build.json
            apps/harbor/harbor.apk
          retention-days: 7

  # eas-cli needs the expo project config even when submitting by id.
  app-store-deploy:
    name: ${{ matrix.label }}
    needs: app-eas-store
    if: ${{ !cancelled() && fromJSON(inputs.plan).flags.deploy_store && needs.app-eas-store.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).matrix.deploy_store }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: forgejo/download-artifact@v4
        with:
          name: ${{ matrix.build }}
          path: apps/harbor
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter polycentric-app...
      - name: Submit to the store
        working-directory: apps/harbor
        env:
          PLATFORM: ${{ matrix.platform }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          BUILD_ID=$(node -p "[].concat(JSON.parse(require('fs').readFileSync('eas-build.json', 'utf8')))[0].id")
          npx eas-cli submit --platform "$PLATFORM" --profile "$CHANNEL" --id "$BUILD_ID" --non-interactive --no-wait

  app-apk-deploy:
    name: ${{ matrix.label }}
    needs: app-eas-apk
    if: ${{ !cancelled() && fromJSON(inputs.plan).flags.deploy_apk && needs.app-eas-apk.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).matrix.deploy_apk }}
    env:
      UPDATE_CHANNEL: ${{ matrix.channel }}
      STATIC_S3_ENDPOINT: ${{ secrets.STATIC_S3_ENDPOINT }}
      STATIC_S3_BUCKET: ${{ vars.STATIC_S3_BUCKET }}
      STATIC_S3_ACCESS_KEY_ID: ${{ secrets.STATIC_S3_ACCESS_KEY_ID }}
      STATIC_S3_SECRET_ACCESS_KEY: ${{ secrets.STATIC_S3_SECRET_ACCESS_KEY }}
      STATIC_PUBLIC_BASE_URL: ${{ vars.STATIC_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: forgejo/download-artifact@v4
        with:
          name: app-android-apk-${{ matrix.channel }}
          path: apps/harbor
      # v* tags put the release notes into latest.json.
      - name: Release notes
        if: matrix.channel == 'production' && fromJSON(inputs.plan).flags.release
        run: node .forgejo/scripts/release-notes.mjs release_notes.md
      - name: Publish the APK
        run: |
          export CI_COMMIT_SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          export CI_COMMIT_TITLE=$(git log -1 --format=%s)
          node .gitlab/ci/scripts/publish-android-update.mjs

  app-ios-e2e:
    name: ${{ matrix.label }}
    needs: app-eas-store
    if: fromJSON(inputs.plan).flags.ios_e2e
    runs-on: ${{ vars.CI_RUNNER_IOS_DEVICE || 'ios-device' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).matrix.ios_e2e }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      MAESTRO_OUTPUT: reports
      MAESTRO_APP_ID: ${{ matrix.app_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: forgejo/download-artifact@v4
        with:
          name: app-ios-${{ matrix.channel }}
          path: apps/harbor
      - name: Install dependencies
        run: pnpm install --filter harbor-e2e... --filter polycentric-app...
      - name: Resign the store build and run iOS e2e
        run: |
          cd apps/harbor
          BUILD_ID=$(node -p "[].concat(JSON.parse(require('fs').readFileSync('eas-build.json', 'utf8')))[0].id")
          node "$GITHUB_WORKSPACE/tools/expo/resign-build.js" "$BUILD_ID" --output harbor.ipa
          MAESTRO_APP_FILE="$PWD/harbor.ipa" pnpm --filter harbor-e2e test:ios
      - uses: forgejo/upload-artifact@v4
        if: always()
        with:
          name: e2e-ios-${{ matrix.channel }}-report
          path: e2e/reports
          retention-days: 7
