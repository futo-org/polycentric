name: apk-build
description: Builds the Android APK on the runner with `eas build --local` (the EAS profile, its credentials and remote version), as apps/harbor/harbor.apk. ci/rust-android job image with GRADLE_USER_HOME under the workspace; needs EXPO_TOKEN.
inputs:
  profile:
    description: staging-apk or production-apk
    required: true
outputs:
  version_name:
    value: ${{ steps.version.outputs.version_name }}
  version_code:
    value: ${{ steps.version.outputs.version_code }}
runs:
  using: composite
  steps:
    - uses: ./.forgejo/actions/sdk-artifacts
      with:
        rn-sdk: 'true'
    - uses: ./.forgejo/actions/setup-pnpm
      with:
        install-args: --filter polycentric-app...
    - uses: ./.forgejo/actions/r2-cache
      with:
        mode: restore
        key: gradle-app-${{ hashFiles('apps/harbor/package.json', 'pnpm-lock.yaml') }}
        path: |
          .gradle/wrapper
          .gradle/caches
    # The version goes into package.json, where app.config.ts reads it. The
    # SDK artifacts are gitignored, so the project is taken from the working
    # tree, not git.
    - shell: bash
      env:
        EAS_PROFILE: ${{ inputs.profile }}
        EAS_NO_VCS: '1'
      run: |
        echo "Building app version $(node tools/expo/resolve-version.js)"
        cd apps/harbor
        npx eas-cli build --platform android --profile "$EAS_PROFILE" --local --non-interactive --output harbor.apk
    - id: version
      shell: bash
      run: |
        aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
        "$aapt2" dump badging apps/harbor/harbor.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*versionName='\([^']*\)'.*/version_code=\1\nversion_name=\2/p" | tee -a "$GITHUB_OUTPUT"
    - uses: ./.forgejo/actions/r2-cache
      with:
        mode: save
        key: gradle-app-${{ hashFiles('apps/harbor/package.json', 'pnpm-lock.yaml') }}
        path: |
          .gradle/wrapper
          .gradle/caches
