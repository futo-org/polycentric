########################################################################
# scraper (Node/TypeScript)
########################################################################

.scraper-workflow:
  image: gitlab.futo.org:5050/devops/manifest-repo/library/docker:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^scraper-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - tools/**/*
        - patches/**/*
        - services/scraper/**/*
        - deploy/charts/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
        - .gitlab/ci/publish_charts.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - tools/**/*
        - patches/**/*
        - services/scraper/**/*
        - deploy/charts/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
        - .gitlab/ci/publish_charts.yml
  variables:
    SERVICE_NAME: scraper
    SERVICE_DIR: scraper

scraper-typecheck:
  extends: .scraper-workflow
  image: node:24-slim
  stage: check
  variables:
    PUPPETEER_SKIP_DOWNLOAD: '1'
  before_script:
    - npm install -g pnpm@10
    - pnpm config set @polycentric:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - pnpm install
  script:
    - pnpm --filter @polycentric/scraper build

scraper-test:
  extends: .scraper-workflow
  image: node:24-slim
  stage: test
  variables:
    PUPPETEER_SKIP_DOWNLOAD: '1'
  before_script:
    - npm install -g pnpm@10
    - pnpm config set @polycentric:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - pnpm install
  script:
    - pnpm --filter @polycentric/scraper test:ci
  artifacts:
    when: always
    reports:
      junit: services/scraper/junit.xml

scraper-integration:
  extends: .scraper-workflow
  image: node:24-slim
  stage: test
  allow_failure: true
  variables:
    PUPPETEER_SKIP_DOWNLOAD: '1'
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends chromium && rm -rf /var/lib/apt/lists/*
    - npm install -g pnpm@10
    - pnpm config set @polycentric:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - pnpm install
  script:
    - pnpm --filter @polycentric/scraper test:integration
  artifacts:
    when: always
    reports:
      junit: services/scraper/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - !reference [.scraper-workflow, rules]

scraper-image:
  extends:
    - .scraper-workflow
    - .service-image
  rules:
    - !reference [.scraper-workflow, rules]
    - !reference [.release-workflow, rules]

########################################################################
# verifier-bot (Node/TypeScript)
########################################################################

.verifier-bot-workflow:
  image: gitlab.futo.org:5050/devops/manifest-repo/library/docker:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^verifier-bot-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - tools/**/*
        - patches/**/*
        - packages/js-*/**/*
        - packages/rs-core-wasm/**/*
        - services/verifier-bot/**/*
        - deploy/charts/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
        - .gitlab/ci/publish_charts.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - tools/**/*
        - patches/**/*
        - packages/js-*/**/*
        - packages/rs-core-wasm/**/*
        - services/verifier-bot/**/*
        - deploy/charts/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
        - .gitlab/ci/publish_charts.yml
  variables:
    SERVICE_NAME: verifier-bot
    SERVICE_DIR: verifier-bot

# Biome lint for the bot. Lints source only, so it needs no build artifacts.
verifier-bot-biome-check:
  extends: .verifier-bot-workflow
  image: node:24-slim
  stage: check
  allow_failure: true
  before_script:
    - npm install -g pnpm@10
    - pnpm config set @polycentric:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - pnpm install --ignore-scripts
  script:
    - pnpm exec biome check services/verifier-bot --diagnostic-level=error
  rules:
    - !reference [.verifier-bot-workflow, rules]

# Credentials come from the VERIFIER_BOT_ENV_VARS CI/CD file variable (base64-encoded .env), decoded into
# the .test.env the suite loads.
verifier-bot-tests:
  extends: .verifier-bot-workflow
  image: node:24-slim
  stage: test
  needs:
    - job: js-sdks-build
      artifacts: true
    - job: rs-core-libraries
      artifacts: true
  variables:
    PUPPETEER_SKIP_DOWNLOAD: '1'
    POLYCENTRIC_VERIFIER_BOT_PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends chromium python3 make g++ && rm -rf /var/lib/apt/lists/*
    - npm install -g pnpm@10
    - pnpm config set @polycentric:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - pnpm install
    - if [ -n "$VERIFIER_BOT_ENV_VARS" ]; then base64 -d "$VERIFIER_BOT_ENV_VARS" > services/verifier-bot/.test.env; fi
  script:
    - pnpm --filter @polycentric/verifier-bot test:ci
  artifacts:
    when: always
    reports:
      junit: services/verifier-bot/junit.xml
  rules:
    # Platforms change their pages without us touching the bot.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - !reference [.verifier-bot-workflow, rules]

verifier-bot-integration:
  extends: .verifier-bot-workflow
  stage: test
  needs:
    - job: verifier-bot-image
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - .gitlab/ci/scripts/verifier-image-health.sh "$CI_REGISTRY_IMAGE/verifier-bot:$CI_COMMIT_SHA"
  rules:
    - !reference [.verifier-bot-workflow, rules]

# Scheduled run against prod bot
verifier-bot-integration-prod:
  image: node:24-slim
  stage: test
  needs: []
  script:
    - node .gitlab/ci/scripts/verifier-health.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# The bot consumes the CI-built js SDKs and rs-core-wasm wasm build (pulled
# in as artifacts); the image build typechecks the bot (see Dockerfile).
verifier-bot-image:
  extends:
    - .verifier-bot-workflow
    - .service-image
  needs:
    - job: js-sdks-build
      artifacts: true
    - job: rs-core-libraries
      artifacts: true
  rules:
    - !reference [.verifier-bot-workflow, rules]
    - !reference [.release-workflow, rules]
